<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Of Your Own&reg; &mdash; The Book</title>
<meta name="description" content="Mind Of Your Own&reg; — the full framework, forthcoming.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  :root {
    --font-display: 'Playfair Display', serif;
    --font-body: 'Inter', sans-serif;
    --font-label: 'Oswald', sans-serif;
    --primary-blue: #4169E1;
  }
  body { margin:0; background:#000; color:#fff; font-family:var(--font-body); }
  .wrap { max-width:1220px; margin:0 auto; padding:0 48px; }
  .label { font-family:var(--font-label); font-size:12px; font-weight:600; letter-spacing:2.5px; color:#8fa3e6; text-transform:uppercase; }

  .hero { padding:90px 0 110px; position:relative; overflow:hidden; min-height:calc(100vh - 220px); display:flex; align-items:center; justify-content:center; }
  .hero-glow {
    position:absolute; top:50%; left:32%; width:640px; height:640px; transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(65,105,225,0.18) 0%, rgba(65,105,225,0.06) 45%, transparent 72%);
    pointer-events:none; z-index:0;
  }
  .hero-grid { display:grid; grid-template-columns:minmax(280px,438px) minmax(0,1fr); gap:70px; align-items:center; position:relative; z-index:2; width:100%; }
  .cover-frame {
    aspect-ratio: 1024/1536; max-width:438px; margin:0 auto; border-radius:6px; overflow:hidden;
    border:1px solid rgba(111,141,237,0.4);
    box-shadow: 0 0 80px 14px rgba(65,105,225,0.28), 0 40px 80px rgba(0,0,0,0.6);
  }
  .cover-frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .status { display:block; margin-bottom:16px; }
  h1 { font-family:var(--font-display); font-weight:700; font-style:normal; font-size:33px; line-height:1.15; margin:0 0 16px; }
  .hero p { font-size:14.5px; line-height:1.65; color:rgba(255,255,255,0.78); margin:0 0 34px; max-width:460px; }
  .cta { display:inline-block; padding:15px 34px; background:linear-gradient(135deg,#4169E1,#1E3A8A); color:#fff; text-decoration:none; border-radius:50px; font-weight:600; font-size:14.5px; box-shadow:0 12px 30px rgba(65,105,225,0.3); }

  @media (max-width:860px) {
    .wrap { padding:0 24px; }
    .hero { padding:60px 0 80px; min-height:0; }
    .hero-grid { grid-template-columns:1fr; gap:44px; text-align:center; }
    .cover-frame { order:-1; max-width:380px; }
    h1 { font-size:32px; }
    .hero p { margin-left:auto; margin-right:auto; }
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="hero-glow"></div>
    <div class="wrap hero-grid">
      <div class="cover-frame">
        <img src="images/mindofyourown.png" alt="Mind Of Your Own — book cover">
      </div>
      <div>
        <span class="label status">Forthcoming</span>
        <h1>Mind Of Your Own&reg; <span style="white-space:nowrap">&mdash; The Book</span></h1>
        <p>The full framework &mdash; how thought, identity, and belief get assembled before you ever get a say, and how to take authorship back. Currently in development.</p>
        <a href="index.html#newsletter" class="cta">Get Notified</a>
      </div>
    </div>
  </section>

  <script src="nav.js"></script>
</body>
</html>
